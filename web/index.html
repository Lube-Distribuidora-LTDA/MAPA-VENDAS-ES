<!doctype html>
<html lang="pt-BR" data-tema="escuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark light">
<title>Mapa de Vendas — Lube Distribuidora</title>
<link rel="icon" href="logo-lube-mini.png">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/mapa.css">
<script>try { var t = localStorage.getItem("mapa-tema"); if (t) document.documentElement.setAttribute("data-tema", t); } catch (e) {}</script>
</head>
<body>
<div id="app">
  <aside id="menu" aria-label="Menu">
    <div class="marca">
      <img class="logo" src="logo-lube.png" alt="Lube Distribuidora">
      <div class="nome">Mapa de Vendas<small id="marca-uf">ES e Bahia</small></div>
    </div>
    <nav id="menu-itens"></nav>
    <div class="menu-rodape" id="menu-rodape"></div>
  </aside>
  <div id="coluna">
    <header id="topo">
      <button class="btn-ic btn-menu" id="btn-menu" aria-label="Abrir menu" title="Menu"></button>
      <div class="tit"><div class="olho" id="olho">ES e Bahia</div><h1 id="titulo">Mapa de vendas</h1></div>
      <div class="acoes">
        <span class="atualizado" id="atualizado"></span>
        <button class="btn-ic" id="btn-atualizar" title="Ler o banco agora"></button>
        <button class="btn-ic" id="btn-tema" title="Tema claro/escuro"></button>

      </div>
    </header>
    <div id="faixa-filtros"></div>
    <main id="conteudo">
      <div class="carrega" id="carrega"><div class="pista"><img src="caminhao-lube.webp" alt=""></div><p>Montando o mapa…</p></div>
    </main>
  </div>
</div>
<div id="pop"></div>
<div id="dica"></div>
<div id="toasts"></div>
<script>window.VERSAO = "2026-11-17";</script>
<script src="vendor/leaflet.js"></script>
<script src="planilha.js"></script>
<script src="js/app.js"></script>
</body>
</html>
